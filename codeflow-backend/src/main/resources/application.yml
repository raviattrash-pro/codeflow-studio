server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: codeflow-backend
  datasource:
    url: jdbc:h2:mem:codeflowdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

codeflow:
  ephemeral-dir: ${user.home}/.codeflow/scratch
  cleanup-after-analysis: true
  ai:
    provider: none  # Options: gemini, openai, ollama, none
    api-key: ""     # Your Gemini or OpenAI API key
    model: gemini-2.0-flash  # gemini-2.0-flash, gpt-4o-mini, codellama
    ollama-url: http://localhost:11434
    max-context-tokens: 2000
    temperature: 0.3

logging:
  level:
    root: INFO
    com.codeflow.studio: DEBUG
