[package]
name = "codeflow-studio"
version = "10.0.0"
description = "CodeFlow Studio — Visual Code Intelligence Desktop"
authors = ["CodeFlow Studio Team"]
edition = "2021"

[lib]
name = "codeflow_studio_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
